<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><meta name="description" content="TaskNote - catatan tugas sekolah sederhana"><link rel="manifest" href="manifest.webmanifest"><title>TaskNote — Catatan Tugas</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.brand span{color:#2563eb}.sub{color:#667085;font-size:14px;margin-top:3px}.panel{background:white;border:1px solid #e5eaf2;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #17203308}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:100px;background:#f7f9fc;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px}.stat small{color:#667085}.progress{height:8px;background:#e8edf5;border-radius:20px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#2563eb;width:0;transition:width .2s}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:650;color:#475467;display:block;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d8dfeb;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:#172033}textarea{resize:vertical;min-height:75px}.span2{grid-column:1/-1}.dateparts{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px}.btn{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#edf2fa;color:#344054}.danger{background:#fff0f0;color:#c62828}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:170px}.toolbar select{width:auto;min-width:130px}.task{display:flex;gap:12px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid #edf0f5}.task:last-child{border-bottom:0}.task input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:#2563eb;flex-shrink:0}.taskmain{flex:1;min-width:0}.tasktitle{font-weight:750;overflow-wrap:anywhere}.done .tasktitle{text-decoration:line-through;color:#98a2b3}.meta{font-size:12px;color:#667085;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}.desc{font-size:13px;color:#475467;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}.taskbuttons{display:flex;gap:6px}.taskbuttons button{padding:7px 9px;font-size:12px}.empty{text-align:center;color:#667085;padding:28px 10px}.hint{font-size:12px;color:#667085;margin-top:8px}.hidden{display:none!important}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.head{align-items:flex-start}.brand{font-size:24px}.taskbuttons{flex-direction:column}}
</style></head><body><main class="wrap">
<header class="head"><div><div class="brand">Task<span>Note</span></div><div class="sub">Catat tugas. Atur deadline. Selesaikan satu per satu.</div></div><button id="installBtn" class="btn secondary hidden">Pasang aplikasi</button></header>
<section class="panel"><div class="stats"><div class="stat"><b id="total">0</b><small>Total tugas</small></div><div class="stat"><b id="pending">0</b><small>Belum selesai</small></div><div class="stat"><b id="completed">0</b><small>Selesai</small></div></div><div class="progress"><div id="progressBar"></div></div><div class="hint" id="progressText">0% selesai</div></section>
<section class="panel"><h2 id="formTitle" style="margin:0 0 15px;font-size:18px">＋ Tambah tugas</h2><form id="taskForm"><div class="formgrid">
<div><label for="subject">Mata pelajaran</label><input id="subject" maxlength="50" placeholder="Contoh: Matematika" required></div>
<div><label for="title">Nama tugas</label><input id="title" maxlength="100" placeholder="Contoh: Latihan halaman 20" required></div>
<div><label>Deadline (boleh dikosongkan)</label><div class="dateparts"><select id="day"><option value="">Tanggal</option></select><select id="month"><option value="">Bulan</option></select><select id="year"><option value="">Tahun</option></select></div></div>
<div><label for="priority">Prioritas</label><select id="priority"><option>Biasa</option><option>Penting</option><option>Mendesak</option></select></div>
<div class="span2"><label for="description">Keterangan (opsional)</label><textarea id="description" maxlength="500" placeholder="Catatan tambahan..."></textarea></div></div><div class="actions"><button class="btn primary" type="submit" id="saveBtn">Simpan tugas</button><button class="btn secondary hidden" type="button" id="cancelBtn">Batal edit</button></div><div class="hint">Tanggal deadline dipilih manual. Data tersimpan di browser/perangkat ini.</div></form></section>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Cari tugas atau mata pelajaran..."><select id="filter"><option value="all">Semua tugas</option><option value="pending">Belum selesai</option><option value="done">Selesai</option></select><select id="sort"><option value="deadline">Urut deadline</option><option value="newest">Terbaru ditambahkan</option><option value="priority">Prioritas</option></select></div><div id="tasks" style="margin-top:12px"></div></section>
<footer class="hint" style="text-align:center">TaskNote · Data tersimpan lokal di perangkat yang digunakan.</footer></main>
<script>
const $=id=>document.getElementById(id), KEY='tasknote_school_v4';let tasks=[],editing=null,seq=0;
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
for(let d=1;d<=31;d++)$('day').add(new Option(d,d));months.forEach((m,i)=>$('month').add(new Option(m,i+1)));for(let y=new Date().getFullYear()-1;y<=new Date().getFullYear()+10;y++)$('year').add(new Option(y,y));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(x)?x:[]}catch{tasks=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{alert('Penyimpanan browser penuh atau dinonaktifkan.')} }
function deadlineFromForm(){let d=$('day').value,m=$('month').value,y=$('year').value;if(!d&&!m&&!y)return '';if(!d||!m||!y)throw Error('Pilih tanggal, bulan, dan tahun lengkap atau kosongkan semuanya.');let date=new Date(+y,+m-1,+d);if(date.getFullYear()!=+y||date.getMonth()!=+m-1||date.getDate()!=+d)throw Error('Tanggal yang dipilih tidak valid.');return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function pretty(s){if(!s)return 'Tanpa deadline';let [y,m,d]=s.split('-');return `${+d} ${months[+m-1]} ${y}`}
function reset(){editing=null;$('taskForm').reset();$('formTitle').textContent='＋ Tambah tugas';$('saveBtn').textContent='Simpan tugas';$('cancelBtn').classList.add('hidden')}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();let deadline;try{deadline=deadlineFromForm()}catch(err){alert(err.message);return}let item={subject:$('subject').value.trim(),title:$('title').value.trim(),description:$('description').value.trim(),priority:$('priority').value,deadline,done:false,created:Date.now()};if(!item.subject||!item.title)return;if(editing!==null){let old=tasks.find(t=>t.id===editing);if(old){Object.assign(old,item,{done:old.done,created:old.created})}}else tasks.unshift({...item,id:Date.now().toString(36)+Math.random().toString(36).slice(2,7)});save();reset();render()});
$('cancelBtn').onclick=reset;
function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;editing=id;$('subject').value=t.subject;$('title').value=t.title;$('description').value=t.description;$('priority').value=t.priority;$('day').value=t.deadline?String(+t.deadline.slice(8)):'';$('month').value=t.deadline?String(+t.deadline.slice(5,7)):'';$('year').value=t.deadline?t.deadline.slice(0,4):'';$('formTitle').textContent='✎ Edit tugas';$('saveBtn').textContent='Simpan perubahan';$('cancelBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function removeTask(id){if(!confirm('Hapus tugas ini?'))return;tasks=tasks.filter(t=>t.id!==id);if(editing===id)reset();save();render()}
function toggleTask(id,done){let t=tasks.find(x=>x.id===id);if(t){t.done=done;save();render()}}
function render(){let total=tasks.length,done=tasks.filter(t=>t.done).length,pending=total-done,pct=total?Math.round(done/total*100):0;$('total').textContent=total;$('pending').textContent=pending;$('completed').textContent=done;$('progressBar').style.width=pct+'%';$('progressText').textContent=pct+'% selesai';let q=$('search').value.toLowerCase(),f=$('filter').value,s=$('sort').value;let list=tasks.filter(t=>(f==='all'||(f==='done'?t.done:!t.done))&&[t.subject,t.title,t.description].join(' ').toLowerCase().includes(q));list.sort((a,b)=>s==='newest'?b.created-a.created:s==='priority'?['Mendesak','Penting','Biasa'].indexOf(a.priority)-['Mendesak','Penting','Biasa'].indexOf(b.priority):((a.deadline||'9999').localeCompare(b.deadline||'9999')));let root=$('tasks');root.replaceChildren();if(!list.length){let p=document.createElement('div');p.className='empty';p.textContent=tasks.length?'Tidak ada tugas yang cocok.':'Belum ada tugas. Tambahkan tugas pertamamu di atas.';root.append(p);return}for(let t of list){let row=document.createElement('div');row.className='task'+(t.done?' done':'');let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','Tandai selesai');cb.onchange=()=>toggleTask(t.id,cb.checked);let main=document.createElement('div');main.className='taskmain';let title=document.createElement('div');title.className='tasktitle';title.textContent=t.title;let meta=document.createElement('div');meta.className='meta';[t.subject,'Deadline: '+pretty(t.deadline),'Prioritas: '+t.priority].forEach(v=>{let span=document.createElement('span');span.textContent=v;meta.append(span)});main.append(title,meta);if(t.description){let desc=document.createElement('div');desc.className='desc';desc.textContent=t.description;main.append(desc)}let buttons=document.createElement('div');buttons.className='taskbuttons';let eb=document.createElement('button');eb.className='btn secondary';eb.textContent='Edit';eb.onclick=()=>editTask(t.id);let db=document.createElement('button');db.className='btn danger';db.textContent='Hapus';db.onclick=()=>removeTask(t.id);buttons.append(eb,db);row.append(cb,main,buttons);root.append(row)}}
['search','filter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));load();render();
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
